apply plugin: 'com.android.application'

android {
    namespace = "in.dairydiary.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "in.dairydiary.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 62
        versionName "1.10.52"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // The farm's signing key is PRIVATE and never committed (anyone holding it could ship an
        // "update" over the installed app). Supply it from outside the repo:
        //   DD_KEYSTORE  = path to the .p12/.jks file   (env var or -PDD_KEYSTORE=...)
        //   DD_KEY_PASS  = its store/key password        (env var or -PDD_KEY_PASS=...)
        //   DD_KEY_ALIAS = key alias (optional, default androiddebugkey)
        // On GitHub Actions these come from the DD_KEYSTORE_B64 / DD_KEY_PASS repo secrets.
        // Without them the build still works, signed with the machine's standard debug key, but
        // that APK will NOT install as an update over the farm phones' app.
        def ddProp = { String k -> System.getenv(k) ?: project.findProperty(k) }
        def ddStore = ddProp('DD_KEYSTORE')
        def ddPass = ddProp('DD_KEY_PASS')
        if (ddStore && ddPass && file(ddStore).exists()) {
            debug {
                storeFile file(ddStore)
                storePassword ddPass
                keyAlias(ddProp('DD_KEY_ALIAS') ?: 'androiddebugkey')
                keyPassword ddPass
            }
            // The farm phones get the RELEASE build (not debuggable: no USB/WebView inspection),
            // signed with the same key, so it installs over the old debug build as an update.
            release {
                storeFile file(ddStore)
                storePassword ddPass
                keyAlias(ddProp('DD_KEY_ALIAS') ?: 'androiddebugkey')
                keyPassword ddPass
            }
        } else {
            logger.warn('Dairy Diary: DD_KEYSTORE/DD_KEY_PASS not set - signing with the local debug key (not installable over the farm app).')
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
    }
    lint {
        // Lint must never block a farm release build on a warning.
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
