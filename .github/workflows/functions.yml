name: Deploy WhatsApp auto-bill functions
# Needs: Firebase Blaze plan, and repo secret FIREBASE_SERVICE_ACCOUNT (JSON key of a service
# account with the "Firebase Admin" + "Cloud Functions Admin" + "Service Account User" roles).
# OPTIONAL (Blaze only). Manual run only. The free GitHub cron (autobill.yml) is what sends now;
# turn that off if this is ever deployed, so the two don't both send.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Skip when the secret is not set yet
        id: chk
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: if [ -z "$SA" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "FIREBASE_SERVICE_ACCOUNT not set - nothing deployed"; fi
      - uses: actions/setup-node@v7
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 22
      - name: Install
        if: steps.chk.outputs.skip != '1'
        run: |
          bash scripts/sync-functions-shared.sh
          cd functions && npm ci
      - name: Deploy
        if: steps.chk.outputs.skip != '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only functions --project project-c9157c64-e3e6-4b08-89f --non-interactive --force
