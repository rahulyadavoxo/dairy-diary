# Optional: build the debug APK on GitHub (Actions tab -> "Build APK" -> Run workflow).
name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      # Private signing key from repo secrets (Settings > Secrets and variables > Actions):
      #   DD_KEYSTORE_B64 = base64 of the .p12 file, DD_KEY_PASS = its password.
      # Without them the APK is signed with a throwaway debug key and won't update the farm phones.
      - name: Restore signing key
        env:
          DD_KEYSTORE_B64: ${{ secrets.DD_KEYSTORE_B64 }}
        run: |
          if [ -n "$DD_KEYSTORE_B64" ]; then
            echo "$DD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dd-release.p12"
            echo "DD_KEYSTORE=$RUNNER_TEMP/dd-release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::DD_KEYSTORE_B64 secret not set - APK will not install over the farm app"
          fi
      - name: Gradle assembleDebug
        run: |
          cd android && chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the real error as annotations (readable without log access)
            grep -E "FAILURE|What went wrong|Caused by|error:|Exception|Keystore|keystore|password" "$RUNNER_TEMP/gradle.log" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
        env:
          DD_KEY_PASS: ${{ secrets.DD_KEY_PASS }}
      - uses: actions/upload-artifact@v7
        with:
          name: dairy-diary-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
