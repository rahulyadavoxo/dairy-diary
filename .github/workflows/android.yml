# Optional: build the debug APK on GitHub (Actions tab -> "Build APK" -> Run workflow).
name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
        env:
          DD_KEY_PASS: ${{ secrets.DD_KEY_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: dairy-diary-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
